<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophisticated Gacha Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 洗練されたレアリティカラー */
            --color-ssr: #fbbf24; /* ゴールド/アンバー */
            --color-sr:  #c084fc; /* アメジスト/パープル */
            --color-r:   #60a5fa; /* スチールブルー */
            
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            width: 100vw;
        }

        /* 洗練された背景グラデーション */
        .bg-ambient {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            z-index: -1;
        }

        /* 画面トランジション */
        .screen-transition {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .screen-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            inset: 0;
            transform: scale(0.98);
        }
        .screen-visible {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            width: 100%; height: 100%;
            transform: scale(1);
        }

        /* バナータブ（左側） */
        .banner-tab {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid transparent;
        }
        .banner-tab.active {
            background: rgba(255, 255, 255, 0.1);
            border-left-color: #f8fafc;
        }
        .banner-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ボタンデザイン（ミニマル） */
        .btn-minimal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .btn-minimal:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .btn-minimal:active {
            transform: translateY(2px);
        }
        .btn-primary {
            background: #f8fafc;
            color: #0f172a;
            border: 1px solid #f8fafc;
        }
        .btn-primary:hover {
            background: #e2e8f0;
        }

        /* カードコンテナ（スクロールバー非表示） */
        .card-container {
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .card-container::-webkit-scrollbar { display: none; }

        @keyframes card-reveal {
            0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .result-card {
            width: 120px;
            height: 240px;
            flex-shrink: 0;
            position: relative;
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: card-reveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            overflow: hidden;
            border-radius: 4px;
        }

        /* レアリティ別のアクセントカラー */
        .card-r::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--color-r); z-index: 10; }
        .card-sr::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--color-sr); z-index: 10; }
        .card-ssr::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; 
            background: var(--color-ssr); 
            z-index: 10; 
            box-shadow: 0 0 15px var(--color-ssr);
        }
        .card-ssr {
            border-color: rgba(251, 191, 36, 0.3);
            box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.15);
        }

        .rarity-label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .text-ssr { color: var(--color-ssr); }
        .text-sr { color: var(--color-sr); }
        .text-r { color: var(--color-r); }

        .card-image-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .result-card:hover .card-image {
            transform: scale(1.05);
        }

        /* キャラクター名の下部グラデーション */
        .card-name-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 8px 8px 8px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95), transparent);
            text-align: center;
        }

        /* モーダル用 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-backdrop.show .modal-content {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>

    <div id="app" class="w-full h-full flex flex-col relative">

        <!-- ============================== -->
        <!-- BANNER SCREEN (Home)           -->
        <!-- ============================== -->
        <div id="banner-screen" class="screen-transition screen-visible flex h-full">
            
            <!-- Left Sidebar (Tabs) -->
            <div class="w-[280px] h-full flex flex-col border-r border-slate-700/50 pt-12 z-20 bg-slate-900/50 backdrop-blur-sm">
                <div class="px-6 mb-8">
                    <h1 class="text-xl font-light tracking-[0.2em] text-slate-300">SCOUT</h1>
                </div>

                <div class="flex flex-col gap-1 w-full">
                    <!-- Banner A Tab -->
                    <div id="tab-bannerA" class="banner-tab active w-full py-4 px-6 cursor-pointer flex items-center gap-4" onclick="switchBanner('bannerA')">
                        <img id="tab-img-A" src="" class="h-12 w-12 object-cover rounded shadow-sm border border-slate-600" alt="Tab">
                        <div class="text-sm font-medium tracking-wide" id="tab-title-A">ピックアップ A</div>
                    </div>
                    <!-- Banner B Tab -->
                    <div id="tab-bannerB" class="banner-tab w-full py-4 px-6 cursor-pointer flex items-center gap-4 text-slate-400" onclick="switchBanner('bannerB')">
                        <img id="tab-img-B" src="" class="h-12 w-12 object-cover rounded shadow-sm border border-slate-700" alt="Tab">
                        <div class="text-sm font-medium tracking-wide" id="tab-title-B">ピックアップ B</div>
                    </div>
                </div>
            </div>

            <!-- Main Banner Display -->
            <div class="flex-1 relative h-full flex items-center justify-center overflow-hidden">
                
                <!-- Background visual element -->
                <div class="absolute inset-0 opacity-20">
                    <div class="absolute inset-0 bg-gradient-to-r from-slate-900 via-transparent to-slate-900 z-10"></div>
                </div>

                <!-- Featured Character -->
                <img id="main-banner-char" src="" class="absolute w-auto h-[100%] max-w-[120%] object-contain object-right-bottom z-10 opacity-90 transition-opacity duration-500" alt="Featured" style="right: -5%;">

                <!-- UI Overlay -->
                <div class="absolute inset-0 z-20 flex flex-col justify-between p-12 pointer-events-none">
                    
                    <!-- Title -->
                    <div class="pointer-events-auto mt-4">
                        <p class="text-slate-400 text-sm tracking-[0.3em] mb-2 uppercase" id="main-banner-subtitle">Premium Scout</p>
                        <h2 id="main-banner-title" class="text-4xl md:text-5xl font-bold tracking-wider leading-tight text-white drop-shadow-xl">
                            BANNER TITLE
                        </h2>
                    </div>

                    <!-- Actions -->
                    <div class="pointer-events-auto flex gap-4 self-end mb-4 mr-12">
                        <button onclick="pullGacha(1)" class="btn-minimal px-8 py-3 rounded text-sm tracking-widest font-medium min-w-[140px]">
                            1回引く
                        </button>
                        <button onclick="pullGacha(10)" class="btn-minimal btn-primary px-10 py-3 rounded text-sm tracking-widest font-medium min-w-[180px]">
                            10回引く
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================== -->
        <!-- RESULTS SCREEN                 -->
        <!-- ============================== -->
        <div id="results-screen" class="screen-transition screen-hidden flex flex-col justify-center items-center h-full bg-slate-900/90 backdrop-blur-md">
            
            <div class="text-center mb-12">
                <h2 class="text-2xl font-light tracking-[0.3em] text-slate-200">SCOUT RESULT</h2>
                <div class="h-[1px] w-16 bg-slate-500 mx-auto mt-4"></div>
            </div>
            
            <!-- カード一覧 -->
            <div id="card-container" class="card-container flex gap-3 px-8 w-full max-w-7xl overflow-x-auto justify-start lg:justify-center items-center pb-4 pt-4">
                <!-- Cards injected here via JS -->
            </div>

            <!-- アクションボタン -->
            <div class="mt-12 flex gap-6 z-20">
                <button onclick="backToBanner()" class="btn-minimal px-10 py-3 rounded text-sm tracking-widest">
                    結果を確定
                </button>
                <button id="btn-pull-again" onclick="confirmPullAgain()" class="btn-minimal btn-primary px-10 py-3 rounded text-sm tracking-widest">
                    もう一度引く
                </button>
            </div>
        </div>

        <!-- ============================== -->
        <!-- CONFIRMATION MODAL             -->
        <!-- ============================== -->
        <div id="confirm-modal" class="modal-backdrop">
            <div class="modal-content rounded-md p-8 w-[400px] max-w-[90%] shadow-2xl relative overflow-hidden">
                <!-- Decorative top line -->
                <div class="absolute top-0 left-0 right-0 h-[2px] bg-slate-500"></div>
                
                <h3 class="text-lg font-medium text-white mb-4 tracking-wide">ガチャ確認</h3>
                <p class="text-slate-300 text-sm leading-relaxed mb-8">
                    今回の結果を破棄して、<br>もう一度ガチャを引き直します。<br>よろしいですか？
                </p>
                
                <div class="flex gap-4 justify-end">
                    <button onclick="closeModal()" class="btn-minimal px-6 py-2 rounded text-xs tracking-widest">
                        キャンセル
                    </button>
                    <button onclick="executePullAgain()" class="btn-minimal btn-primary px-6 py-2 rounded text-xs tracking-widest">
                        決定
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 【キャラクター設定】 (Character Configuration)
        // ここに10キャラクター分の画像URLと設定を入れます。
        // ※背景が暗い画像や、透明背景のキャラ絵が似合います。
        // ==========================================
        const myCharacters = [
            // SSR (確率低 - とてもレア)
            { id: 1, name: "閃光の剣姫", rarity: "SSR", imageUrl: "" },
            { id: 2, name: "漆黒の魔導士", rarity: "SSR", imageUrl: "" },
            
            // SR (確率中 - 少しレア)
            { id: 3, name: "白銀の騎士", rarity: "SR", imageUrl: "" },
            { id: 4, name: "紅蓮の弓使い", rarity: "SR", imageUrl: "" },
            { id: 5, name: "蒼天の槍兵", rarity: "SR", imageUrl: "" },
            
            // R (確率高 - ノーマル)
            { id: 6, name: "傭兵", rarity: "R", imageUrl: "" },
            { id: 7, name: "斥候", rarity: "R", imageUrl: "" },
            { id: 8, name: "治癒士", rarity: "R", imageUrl: "" },
            { id: 9, name: "魔術師見習い", rarity: "R", imageUrl: "" },
            { id: 10, name: "重装歩兵", rarity: "R", imageUrl: "https://images.unsplash.com/photo-1620063234914-610190117ff0?q=80&w=400&auto=format&fit=crop" },
        ];

        // ==========================================
        // バナー設定 (Banner Configuration)
        // ==========================================
        const banners = {
            bannerA: {
                id: 'bannerA',
                title: "てつやひく",
                subtitle: "PREMIUM SCOUT VOL.1",
                featuredImage: "https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?q=80&w=800&auto=format&fit=crop", 
                tabImage: "https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?q=80&w=150&auto=format&fit=crop",
            },
            bannerB: {
                id: 'bannerB',
                title: "がちゃB",
                subtitle: "PREMIUM SCOUT VOL.2",
                featuredImage: "https://images.unsplash.com/photo-1534430480872-3498386e7856?q=80&w=800&auto=format&fit=crop",
                tabImage: "https://images.unsplash.com/photo-1534430480872-3498386e7856?q=80&w=150&auto=format&fit=crop",
            }
        };

        let currentBanner = 'bannerA';
        let lastPullCount = 10;

        // UI要素
        const bannerScreen = document.getElementById('banner-screen');
        const resultsScreen = document.getElementById('results-screen');
        const cardContainer = document.getElementById('card-container');
        const btnPullAgain = document.getElementById('btn-pull-again');
        const modal = document.getElementById('confirm-modal');

        function init() {
            // タブ画像の初期化
            document.getElementById('tab-img-A').src = banners.bannerA.tabImage;
            document.getElementById('tab-title-A').innerText = banners.bannerA.title;
            document.getElementById('tab-img-B').src = banners.bannerB.tabImage;
            document.getElementById('tab-title-B').innerText = banners.bannerB.title;

            renderBanner(currentBanner);
        }

        function switchBanner(bannerId) {
            currentBanner = bannerId;
            
            // タブUI更新
            document.querySelectorAll('.banner-tab').forEach(tab => {
                tab.classList.remove('active');
                tab.classList.add('text-slate-400');
            });
            const activeTab = document.getElementById(`tab-${bannerId}`);
            activeTab.classList.add('active');
            activeTab.classList.remove('text-slate-400');

            renderBanner(bannerId);
        }

        function renderBanner(bannerId) {
            const b = banners[bannerId];
            const titleEl = document.getElementById('main-banner-title');
            const subTitleEl = document.getElementById('main-banner-subtitle');
            const imgEl = document.getElementById('main-banner-char');

            // フェード効果
            titleEl.style.opacity = 0;
            subTitleEl.style.opacity = 0;
            imgEl.style.opacity = 0;

            setTimeout(() => {
                titleEl.innerText = b.title;
                subTitleEl.innerText = b.subtitle;
                imgEl.src = b.featuredImage;
                
                const transition = 'opacity 0.4s ease-out';
                titleEl.style.transition = transition;
                subTitleEl.style.transition = transition;
                
                titleEl.style.opacity = 1;
                subTitleEl.style.opacity = 1;
                imgEl.style.opacity = 0.9;
            }, 200);
        }

        function pullGacha(times) {
            lastPullCount = times;
            const results = [];
            for(let i = 0; i < times; i++) {
                results.push(getRandomCharacter());
            }
            showResults(results);
        }

        function getRandomCharacter() {
            // 提供割合の内部設定 (SSR: 5%, SR: 25%, R: 70%)
            const roll = Math.random() * 100;
            let targetRarity = "R";
            if (roll <= 5) targetRarity = "SSR";
            else if (roll <= 30) targetRarity = "SR";

            const pool = myCharacters.filter(c => c.rarity === targetRarity);
            if (pool.length === 0) return myCharacters[Math.floor(Math.random() * myCharacters.length)];
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function showResults(pulledChars) {
            // 画面切り替え
            bannerScreen.classList.remove('screen-visible');
            bannerScreen.classList.add('screen-hidden');
            
            resultsScreen.classList.remove('screen-hidden');
            resultsScreen.classList.add('screen-visible');

            // レイアウトとボタンテキストの更新
            if(lastPullCount === 1) {
                btnPullAgain.innerText = "もう一度 1回引く";
                // 1回引く場合は画面中央に強制的に配置
                cardContainer.className = "card-container flex gap-3 px-8 w-full max-w-7xl overflow-x-auto justify-center items-center pb-4 pt-4";
            } else {
                btnPullAgain.innerText = "もう一度 10回引く";
                // 10回引く場合は画面幅に応じて左揃え(スマホスクロール用) または 中央揃え(PC用)
                cardContainer.className = "card-container flex gap-3 px-8 w-full max-w-7xl overflow-x-auto justify-start lg:justify-center items-center pb-4 pt-4";
            }

            // カード生成
            cardContainer.innerHTML = '';
            pulledChars.forEach((char, index) => {
                const delay = index * 0.08; 
                
                const cardClass = `card-${char.rarity.toLowerCase()}`;
                const textClass = `text-${char.rarity.toLowerCase()}`;

                const cardHTML = `
                    <div class="result-card ${cardClass}" style="animation-delay: ${delay}s;">
                        <div class="rarity-label ${textClass}">${char.rarity}</div>
                        <div class="card-image-wrapper">
                            <img src="${char.imageUrl}" alt="${char.name}" class="card-image">
                        </div>
                        <div class="card-name-bar">
                            <span class="text-xs font-medium text-slate-100 truncate block">${char.name}</span>
                        </div>
                    </div>
                `;
                cardContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function backToBanner() {
            resultsScreen.classList.remove('screen-visible');
            resultsScreen.classList.add('screen-hidden');
            
            bannerScreen.classList.remove('screen-hidden');
            bannerScreen.classList.add('screen-visible');
        }

        // --- モーダル制御 ---
        function confirmPullAgain() {
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
        }

        function executePullAgain() {
            closeModal();
            // 少し遅延させてモーダルが消えてからガチャを回す
            setTimeout(() => {
                pullGacha(lastPullCount);
            }, 300);
        }

        window.onload = init;
    </script>
</body>
</html>
