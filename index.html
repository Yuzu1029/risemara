<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sophisticated Gacha Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 洗練されたレアリティカラー */
            --color-ssr: #fbbf24; /* ゴールド/アンバー */
            --color-sr:  #c084fc; /* アメジスト/パープル */
            --color-r:   #60a5fa; /* スチールブルー */
            
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
        }

        /* 画面全体を確実に100%に固定し、スクロールバーを出さない */
        html, body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* スクロールバー非表示 */
        .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* 画面トランジション */
        .screen-transition {
            transition: opacity 0.4s ease;
        }
        .screen-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            inset: 0;
            display: none !important;
        }
        .screen-visible {
            opacity: 1;
            pointer-events: auto;
            position: absolute;
            inset: 0;
            display: flex !important;
        }

        /* --------------------------------------
           バナータブ（全体画像表示対応）
           -------------------------------------- */
        .banner-tab {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid transparent;
            height: 4.5rem;
            flex-shrink: 0;
        }
        .banner-tab.active {
            border-left-color: #f8fafc;
        }
        .tab-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 0;
        }
        .banner-tab.active .tab-bg-img {
            opacity: 0.8;
            transform: scale(1.05);
        }
        .banner-tab:hover:not(.active) .tab-bg-img {
            opacity: 0.5;
        }
        .tab-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.6) 50%, transparent 100%);
            z-index: 1;
        }
        .tab-content {
            position: relative;
            z-index: 2;
            padding: 0 1.25rem;
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            color: #94a3b8;
        }
        .banner-tab.active .tab-content {
            color: #ffffff;
            font-weight: 700;
        }

        /* ボタンデザイン（ミニマル） */
        .btn-minimal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .btn-minimal:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .btn-minimal:active {
            transform: translateY(2px);
        }
        .btn-primary {
            background: #f8fafc;
            color: #0f172a;
            border: 1px solid #f8fafc;
        }
        .btn-primary:hover {
            background: #e2e8f0;
        }

        @keyframes card-reveal {
            0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .result-card {
            width: 110px;
            height: 220px;
            flex-shrink: 0;
            position: relative;
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: card-reveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            overflow: hidden;
            border-radius: 4px;
        }
        @media (min-width: 768px) {
            .result-card { width: 120px; height: 240px; }
        }

        /* レアリティ別のアクセントカラー */
        .card-r::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--color-r); z-index: 10; }
        .card-sr::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--color-sr); z-index: 10; }
        .card-ssr::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; 
            background: var(--color-ssr); 
            z-index: 10; 
            box-shadow: 0 0 15px var(--color-ssr);
        }
        .card-ssr {
            border-color: rgba(251, 191, 36, 0.3);
            box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.15);
        }

        .rarity-label {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .text-ssr { color: var(--color-ssr); }
        .text-sr { color: var(--color-sr); }
        .text-r { color: var(--color-r); }

        .card-image-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .result-card:hover .card-image {
            transform: scale(1.05);
        }

        /* キャラクター名の下部グラデーション */
        .card-name-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 6px 6px 6px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95), transparent);
            text-align: center;
        }

        /* モーダル用 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-backdrop.show .modal-content {
            transform: translateY(0);
        }

        /* ==========================================================
           レスポンシブ対応（スマホ縦・横 / デスクトップ）
           デスクトップ（768px以上）は既存のUI・見た目を一切変更しない。
           768px未満（スマホ）のみ、向きに応じてレイアウトを最適化する。
           ========================================================== */

        /* ---- スマホ 縦画面 (portrait) ---- */
        @media (max-width: 767px) and (orientation: portrait) {
            #sidebar {
                width: 92px !important;
            }
            #sidebar-title {
                display: none;
            }
            .banner-tab {
                height: 4rem;
            }
            .tab-content {
                padding: 0 0.5rem;
                font-size: 0.62rem;
                letter-spacing: 0.02em;
                line-height: 1.15;
                text-align: left;
            }
            .tab-overlay {
                background: linear-gradient(90deg, rgba(15,23,42,0.97) 0%, rgba(15,23,42,0.85) 60%, rgba(15,23,42,0.5) 100%);
            }
            #right-area {
                padding: 1rem 1rem 1.1rem 1rem !important;
            }
            #main-banner-subtitle {
                font-size: 0.6rem !important;
                letter-spacing: 0.15em !important;
            }
            #main-banner-title {
                font-size: 1.5rem !important;
                line-height: 1.25 !important;
            }
            #gacha-actions {
                gap: 0.5rem !important;
                margin-right: 0 !important;
            }
            #gacha-actions button {
                padding: 0.65rem 0.5rem !important;
                font-size: 0.65rem !important;
                min-width: 0 !important;
                letter-spacing: 0.05em !important;
                flex: 1 1 0;
            }
            #results-screen {
                padding-top: 1rem;
                padding-bottom: 1rem;
            }
            #results-screen h2 {
                font-size: 1rem !important;
                letter-spacing: 0.2em !important;
            }
            .result-card {
                width: 84px;
                height: 168px;
            }
            #results-actions {
                gap: 0.75rem !important;
            }
            #results-actions button {
                padding: 0.6rem 1rem !important;
                font-size: 0.62rem !important;
                letter-spacing: 0.05em !important;
            }
            .modal-content {
                width: 88% !important;
                padding: 1.25rem !important;
            }
        }

        /* ---- スマホ 横画面 (landscape / 低高さ) ---- */
        @media (max-width: 926px) and (orientation: landscape) and (max-height: 500px) {
            #sidebar {
                width: 150px !important;
            }
            .banner-tab {
                height: 3rem;
            }
            .tab-content {
                padding: 0 0.75rem;
                font-size: 0.65rem;
            }
            #sidebar-header {
                margin-bottom: 0.5rem !important;
                padding-top: 0 !important;
            }
            #right-area {
                padding: 0.75rem 1.25rem !important;
            }
            #main-banner-subtitle {
                font-size: 0.6rem !important;
                margin-bottom: 0.25rem !important;
            }
            #main-banner-title {
                font-size: 1.5rem !important;
            }
            #gacha-actions {
                margin-bottom: 0.25rem !important;
                gap: 0.5rem !important;
            }
            #gacha-actions button {
                padding: 0.5rem 1rem !important;
                font-size: 0.62rem !important;
                min-width: 90px !important;
            }
            #results-screen {
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }
            #results-screen h2 {
                font-size: 0.9rem !important;
            }
            .result-card {
                width: 70px;
                height: 150px;
            }
            .card-name-bar {
                padding: 10px 4px 4px 4px;
            }
            .card-name-bar span {
                font-size: 0.6rem !important;
            }
            #results-actions {
                gap: 0.5rem !important;
                margin-bottom: 0 !important;
            }
            #results-actions button {
                padding: 0.45rem 0.9rem !important;
                font-size: 0.6rem !important;
            }
            .modal-content {
                width: 320px !important;
                padding: 1rem 1.25rem !important;
            }
            .modal-content h3 {
                margin-bottom: 0.5rem !important;
            }
            .modal-content p {
                margin-bottom: 1rem !important;
            }
        }

        /* 非常に小さい/短い画面の保険（縦・横共通） */
        @media (max-height: 420px) {
            .result-card {
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <div id="app" class="w-full h-full relative overflow-hidden">

        <!-- ============================== -->
        <!-- BANNER SCREEN (Home)           -->
        <!-- ============================== -->
        <div id="banner-screen" class="screen-transition screen-visible w-full h-full">
            
            <!-- 全画面背景画像 (object-cover で画面全体を隙間なく埋める) -->
            <img id="main-banner-char" src="" class="absolute inset-0 w-full h-full object-cover z-0 opacity-90 transition-opacity duration-500" alt="Featured">
            
            <!-- 視認性向上のためのグラデーション -->
            <div class="absolute inset-0 bg-gradient-to-r from-slate-950/95 via-slate-950/40 to-transparent z-0"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent z-0"></div>

            <!-- UIレイヤー -->
            <div class="absolute inset-0 z-10 flex w-full h-full">
                
                <!-- Left Sidebar (Tabs) -->
                <div id="sidebar" class="w-[260px] md:w-[300px] h-full flex flex-col border-r border-slate-700/40 pt-8 md:pt-12 bg-slate-950/50 backdrop-blur-md shrink-0">
                    <div id="sidebar-header" class="px-6 mb-6 shrink-0">
                        <h1 id="sidebar-title" class="text-lg md:text-xl font-light tracking-[0.2em] text-slate-300">SCOUT</h1>
                    </div>

                    <!-- タブリスト -->
                    <div class="flex flex-col gap-1 w-full flex-1 overflow-y-auto scrollbar-hide">
                        <!-- Banner A Tab -->
                        <div id="tab-bannerA" class="banner-tab active w-full cursor-pointer" onclick="switchBanner('bannerA')">
                            <img id="tab-img-A" src="" class="tab-bg-img" alt="Tab">
                            <div class="tab-overlay"></div>
                            <div class="tab-content" id="tab-title-A">ピックアップ A</div>
                        </div>
                        <!-- Banner B Tab -->
                        <div id="tab-bannerB" class="banner-tab w-full cursor-pointer" onclick="switchBanner('bannerB')">
                            <img id="tab-img-B" src="" class="tab-bg-img" alt="Tab">
                            <div class="tab-overlay"></div>
                            <div class="tab-content" id="tab-title-B">ピックアップ B</div>
                        </div>
                    </div>
                </div>

                <!-- Right Area (Text & Buttons) -->
                <div id="right-area" class="flex-1 flex flex-col justify-between p-6 md:p-12">
                    <!-- Title -->
                    <div class="mt-2 md:mt-4">
                        <p class="text-slate-400 text-xs md:text-sm tracking-[0.3em] mb-1 md:mb-2 uppercase" id="main-banner-subtitle">Premium Scout</p>
                        <h2 id="main-banner-title" class="text-3xl md:text-5xl font-bold tracking-wider leading-tight text-white drop-shadow-xl">
                            BANNER TITLE
                        </h2>
                    </div>

                    <!-- Actions -->
                    <div id="gacha-actions" class="flex gap-3 md:gap-4 self-end mb-2 md:mb-4 mr-2 md:mr-6">
                        <button onclick="pullGacha(1)" class="btn-minimal px-6 md:px-8 py-3 rounded text-xs md:text-sm tracking-widest font-medium min-w-[120px] md:min-w-[140px]">
                            1回引く
                        </button>
                        <button onclick="pullGacha(10)" class="btn-minimal btn-primary px-8 md:px-10 py-3 rounded text-xs md:text-sm tracking-widest font-medium min-w-[150px] md:min-w-[180px]">
                            10回引く
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================== -->
        <!-- RESULTS SCREEN                 -->
        <!-- ============================== -->
        <div id="results-screen" class="screen-transition screen-hidden flex flex-col justify-between items-center w-full h-full bg-slate-950/95 backdrop-blur-md z-30 py-6 md:py-10">
            
            <div class="text-center shrink-0 mt-2">
                <h2 class="text-lg md:text-2xl font-light tracking-[0.3em] text-slate-200">SCOUT RESULT</h2>
                <div class="h-[1px] w-12 md:w-16 bg-slate-500 mx-auto mt-2 md:mt-3"></div>
            </div>
            
            <!-- カード一覧（中央寄せ＆横スクロール対応） -->
            <div class="w-full flex overflow-x-auto scrollbar-hide my-auto px-4">
                <div id="card-container" class="flex gap-2 md:gap-3 m-auto py-2">
                    <!-- Cards injected here via JS -->
                </div>
            </div>

            <!-- アクションボタン -->
            <div id="results-actions" class="flex flex-row gap-4 md:gap-6 z-20 shrink-0 mb-2">
                <button onclick="backToBanner()" class="btn-minimal px-6 md:px-10 py-3 rounded text-xs md:text-sm tracking-widest">
                    結果を確定
                </button>
                <button id="btn-pull-again" onclick="confirmPullAgain()" class="btn-minimal btn-primary px-6 md:px-10 py-3 rounded text-xs md:text-sm tracking-widest">
                    もう一度引く
                </button>
            </div>
        </div>

        <!-- ============================== -->
        <!-- CONFIRMATION MODAL             -->
        <!-- ============================== -->
        <div id="confirm-modal" class="modal-backdrop z-50">
            <div class="modal-content rounded-md p-6 md:p-8 w-[360px] md:w-[400px] max-w-[90%] shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-[2px] bg-slate-500"></div>
                
                <h3 class="text-base md:text-lg font-medium text-white mb-3 md:mb-4 tracking-wide">ガチャ確認</h3>
                <p class="text-slate-300 text-xs md:text-sm leading-relaxed mb-6 md:mb-8">
                    今回の結果を破棄して、<br>もう一度ガチャを引き直します。<br>よろしいですか？
                </p>
                
                <div class="flex gap-3 md:gap-4 justify-end">
                    <button onclick="closeModal()" class="btn-minimal px-5 py-2 rounded text-xs tracking-widest">
                        キャンセル
                    </button>
                    <button onclick="executePullAgain()" class="btn-minimal btn-primary px-5 py-2 rounded text-xs tracking-widest">
                        決定
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 【キャラクター設定】 
        // ==========================================
        const myCharacters = [
            { id: 1, name: "閃光の剣姫", rarity: "SSR", imageUrl: "https://placehold.co/240x480/fbbf24/000?text=SSR+1" },
            { id: 2, name: "漆黒の魔導士", rarity: "SSR", imageUrl: "https://placehold.co/240x480/fbbf24/000?text=SSR+2" },
            
            { id: 3, name: "白銀の騎士", rarity: "SR", imageUrl: "https://placehold.co/240x480/c084fc/fff?text=SR+1" },
            { id: 4, name: "紅蓮の弓使い", rarity: "SR", imageUrl: "https://placehold.co/240x480/c084fc/fff?text=SR+2" },
            { id: 5, name: "蒼天の槍兵", rarity: "SR", imageUrl: "https://placehold.co/240x480/c084fc/fff?text=SR+3" },
            
            { id: 6, name: "傭兵", rarity: "R", imageUrl: "https://placehold.co/240x480/60a5fa/000?text=R+1" },
            { id: 7, name: "斥候", rarity: "R", imageUrl: "https://placehold.co/240x480/60a5fa/000?text=R+2" },
            { id: 8, name: "治癒士", rarity: "R", imageUrl: "https://placehold.co/240x480/60a5fa/000?text=R+3" },
            { id: 9, name: "魔術師見習い", rarity: "R", imageUrl: "yuzuirasuto.png" },
            { id: 10, name: "重装歩兵", rarity: "R", imageUrl: "https://placehold.co/240x480/60a5fa/000?text=R+5" },
        ];

        // ==========================================
        // バナー設定
        // ==========================================
        const banners = {
            bannerA: {
                id: 'bannerA',
                title: "ガチャA",
                subtitle: "PREMIUM SCOUT VOL.1",
                featuredImage: "mogmog.jpg", 
                tabImage: "https://placehold.co/400x150/1e293b/fff?text=Tab+A+Bg",
            },
            bannerB: {
                id: 'bannerB',
                title: "ガチャB",
                subtitle: "PREMIUM SCOUT VOL.2",
                featuredImage: "https://placehold.co/1920x1080/334155/fff?text=Banner+B+Fullscreen",
                tabImage: "https://placehold.co/400x150/334155/fff?text=Tab+B+Bg",
            }
        };

        let currentBanner = 'bannerA';
        let lastPullCount = 10;

        const bannerScreen = document.getElementById('banner-screen');
        const resultsScreen = document.getElementById('results-screen');
        const cardContainer = document.getElementById('card-container');
        const btnPullAgain = document.getElementById('btn-pull-again');
        const modal = document.getElementById('confirm-modal');

        function init() {
            document.getElementById('tab-img-A').src = banners.bannerA.tabImage;
            document.getElementById('tab-title-A').innerText = banners.bannerA.title;
            document.getElementById('tab-img-B').src = banners.bannerB.tabImage;
            document.getElementById('tab-title-B').innerText = banners.bannerB.title;

            renderBanner(currentBanner);
        }

        function switchBanner(bannerId) {
            currentBanner = bannerId;
            
            document.querySelectorAll('.banner-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            const activeTab = document.getElementById(`tab-${bannerId}`);
            activeTab.classList.add('active');

            renderBanner(bannerId);
        }

        function renderBanner(bannerId) {
            const b = banners[bannerId];
            const titleEl = document.getElementById('main-banner-title');
            const subTitleEl = document.getElementById('main-banner-subtitle');
            const imgEl = document.getElementById('main-banner-char');

            titleEl.style.opacity = 0;
            subTitleEl.style.opacity = 0;
            imgEl.style.opacity = 0;

            setTimeout(() => {
                titleEl.innerText = b.title;
                subTitleEl.innerText = b.subtitle;
                imgEl.src = b.featuredImage;
                
                const transition = 'opacity 0.4s ease-out';
                titleEl.style.transition = transition;
                subTitleEl.style.transition = transition;
                
                titleEl.style.opacity = 1;
                subTitleEl.style.opacity = 1;
                imgEl.style.opacity = 0.9;
            }, 200);
        }

        function pullGacha(times) {
            lastPullCount = times;
            const results = [];
            for(let i = 0; i < times; i++) {
                results.push(getRandomCharacter());
            }
            showResults(results);
        }

        function getRandomCharacter() {
            const roll = Math.random() * 100;
            let targetRarity = "R";
            if (roll <= 5) targetRarity = "SSR";
            else if (roll <= 30) targetRarity = "SR";

            const pool = myCharacters.filter(c => c.rarity === targetRarity);
            if (pool.length === 0) return myCharacters[Math.floor(Math.random() * myCharacters.length)];
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function showResults(pulledChars) {
            bannerScreen.classList.remove('screen-visible');
            bannerScreen.classList.add('screen-hidden');
            
            resultsScreen.classList.remove('screen-hidden');
            resultsScreen.classList.add('screen-visible');

            if(lastPullCount === 1) {
                btnPullAgain.innerText = "もう一度 1回引く";
            } else {
                btnPullAgain.innerText = "もう一度 10回引く";
            }

            cardContainer.innerHTML = '';
            pulledChars.forEach((char, index) => {
                const delay = index * 0.08; 
                
                const cardClass = `card-${char.rarity.toLowerCase()}`;
                const textClass = `text-${char.rarity.toLowerCase()}`;

                const cardHTML = `
                    <div class="result-card ${cardClass}" style="animation-delay: ${delay}s;">
                        <div class="rarity-label ${textClass}">${char.rarity}</div>
                        <div class="card-image-wrapper">
                            <img src="${char.imageUrl}" alt="${char.name}" class="card-image">
                        </div>
                        <div class="card-name-bar">
                            <span class="text-xs font-medium text-slate-100 truncate block">${char.name}</span>
                        </div>
                    </div>
                `;
                cardContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function backToBanner() {
            resultsScreen.classList.remove('screen-visible');
            resultsScreen.classList.add('screen-hidden');
            
            bannerScreen.classList.remove('screen-hidden');
            bannerScreen.classList.add('screen-visible');
        }

        function confirmPullAgain() {
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
        }

        function executePullAgain() {
            closeModal();
            setTimeout(() => {
                pullGacha(lastPullCount);
            }, 300);
        }

        window.onload = init;
    </script>
</body>
</html>
